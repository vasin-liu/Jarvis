[package]
name = "tauri-app"
version.workspace = true
description = "A Tauri App"
authors = ["you"]
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
store = { path = "../crates/store" }
chunker = { path = "../crates/chunker" }
ingest = { path = "../crates/ingest" }
embedder = { path = "../crates/embedder" }
indexer = { path = "../crates/indexer" }
retriever = { path = "../crates/retriever" }
llm = { path = "../crates/llm" }
rag = { path = "../crates/rag" }
config = { path = "../crates/config" }
watcher = { path = "../crates/watcher" }
lark = { path = "../crates/lark" }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
