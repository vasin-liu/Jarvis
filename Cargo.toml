[workspace]
members = [
    "src-tauri",
    "crates/store",
    "crates/chunker",
    "crates/ingest",
    "crates/embedder",
    "crates/indexer",
    "crates/retriever",
    "crates/llm",
    "crates/rag",
    "crates/config",
    "crates/watcher",
    "crates/lark",
    "crates/cursor",
    "crates/insights",
    "crates/memory",
    "crates/agent",
]
resolver = "2"

[workspace.package]
version = "1.6.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs"] }
sha2 = "0.10"
hex = "0.4"
notify = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
fastembed = "5"
