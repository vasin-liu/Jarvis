name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Windows)
    runs-on: windows-latest
    needs: [rust, frontend]
    env:
      JARVIS_E2E: "1"
      JARVIS_E2E_FIXTURE: ${{ github.workspace }}/e2e/fixtures/sample.md
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Install msedgedriver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --locked
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          Write-Output "$PWD" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build release app (production webview, embeds dist)
        run: npm run build:e2e
      - name: Run E2E
        run: npm run test:e2e
